<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Player with a fullscreen button</title>
<!-- A player that drives the fullscreen API itself, the way every real one
     does: its own button, and its own idea of what "fullscreen" means. -->
<style>
  body { margin:0; padding:24px; background:#0e0e12; color:#ddd; font-family:sans-serif; }
  .player { position:relative; width:560px; height:315px; background:#000; }
  .player video { width:100%; height:100%; }
  .bar { position:absolute; left:0; right:0; bottom:0; height:34px; z-index:5;
         background:rgba(0,0,0,.7); color:#fff; display:flex; align-items:center;
         gap:10px; padding:0 12px; font-size:13px; }
  .bar button { margin-left:auto; height:22px; border:0; border-radius:4px;
                background:#333; color:#fff; font:inherit; font-size:12px; cursor:pointer; }
  .player.is-fullscreen .bar { height:48px; font-size:15px; }
</style></head>
<body>
  <h1>Player with a fullscreen button</h1>
  <div class="player" id="player">
    <video id="v" src="sample.webm" preload="auto"></video>
    <div class="bar">
      <span id="label">windowed</span>
      <button id="fsButton">Fullscreen</button>
    </div>
  </div>
  <script>
    const player = document.getElementById('player');
    const label = document.getElementById('label');
    const button = document.getElementById('fsButton');
    window.fsEvents = 0;

    button.addEventListener('click', () => {
      if (document.fullscreenElement) document.exitFullscreen();
      else player.requestFullscreen();
    });

    document.addEventListener('fullscreenchange', () => {
      window.fsEvents++;
      const on = document.fullscreenElement === player;
      player.classList.toggle('is-fullscreen', on);
      label.textContent = on ? 'fullscreen' : 'windowed';
      button.textContent = on ? 'Exit' : 'Fullscreen';
    });
  </script>
</body></html>
